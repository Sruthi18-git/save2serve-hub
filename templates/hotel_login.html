<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Login - SAVE2SERVE HUB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>🏨 Hotel Login</h2>
        
        <!-- Flash messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('login', user_type='hotel') }}">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px;">
            Don't have an account? <a href="{{ url_for('hotel_register') }}">Register here</a>
        </p>
        <p style="text-align: center;">
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </p>
    </div>
        <!-- In hotel registration/login form -->
<script>
// Automatically request location permission on page load
document.addEventListener('DOMContentLoaded', function() {
    if ("geolocation" in navigator) {
        // Try to get location silently
        navigator.geolocation.getCurrentPosition(
            function(position) {
                // Store in hidden fields
                document.getElementById('latitude').value = position.coords.latitude;
                document.getElementById('longitude').value = position.coords.longitude;
                
                // Auto-save via AJAX
                fetch('/save_hotel_location', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    })
                });
                
                console.log('Location auto-captured:', position.coords);
            },
            function(error) {
                console.log('Location permission denied, using IP fallback');
                // Will use IP-based method instead
            },
            {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            }
        );
    }
});
</script>

<!-- Add hidden fields to your form -->
<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">
</body>
</html>
